<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", stored === "light" ? "light" : "dark");
      })();
    </script>
    <script>
      // Counterpart to public/404.html's redirect — restores the real URL
      // (path/query/hash) before React Router mounts, so a deep link that
      // bounced through 404.html ends up on the right page instead of "/".
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get("redirect");
        if (redirect) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio — Experience, Skills, Projects, and Resume." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Muhammad Sohaib</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
