server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (also future-proofs for Phase 2 client-side routes)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed, immutable Vite build assets
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Resume PDF: allow updates to show up reasonably quickly
    location = /resume/resume.pdf {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Never cache the HTML shell so deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
